[package]
name = "matthew-app"
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
base64 = "0.22"
matthew = { path = "../lib", features = ["serde"] }
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tempfile = "3"
tokio = { version = "1.47.1", features = ["rt-multi-thread", "process", "time", "io-util", "io-std", "macros"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
